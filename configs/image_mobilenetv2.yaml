# Image model release candidate.
# MobileNetV2 dùng input 96x96x3, tốt hơn CNN 28x28 khi hình có chi tiết nhỏ.
model:
  name: mobilenetv2
  input_size: 96
  pretrained: true
  alpha: 0.35
  dropout: 0.25
training:
  seed: 42
  epochs: 20
  batch_size: 64
  learning_rate: 0.0005
  fine_tune_learning_rate: 0.00005
  validation_ratio: 0.15
  quickdraw_limit_per_class: 1000
  use_user_data: true
  use_quickdraw: true
augmentation:
  rotation: 0.08
  translation: 0.08
  zoom: 0.12
  stroke_width_jitter: true
release:
  min_accuracy: 0.75
  min_macro_f1: 0.70
  max_latency_ms_p95: 45
